<ul {% render_attrs attrs id=target|default:None class="divide-y divide-solid" %}>
  {{ content }}
</ul>

{% partialdef item %}
  <li {% render_attrs attrs class="py-3 first:pt-0 last:pb-0" %}>
    {{ content }}
  </li>
{% endpartialdef item %}

{% partialdef empty %}
  <li {% render_attrs attrs class="space-y-3 text-center prose sm:text-start dark:prose-invert" %}>
    {{ content }}
  </li>
{% endpartialdef empty %}

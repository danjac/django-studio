{% load i18n static %}
<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
  <head>
    {% block title %}{% title_tag %}{% endblock %}
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    {% meta_tags %}
    <link rel="manifest" href="{% url 'manifest' %}">
    <link rel="icon" href="{% url 'favicon' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'app.css' %}" />
    <script src="{% static 'vendor/htmx.js' %}"></script>
    <script src="{% static 'vendor/alpine.js' %}" defer></script>
    <script src="{% static 'indicator.js' %}"></script>
    <script nonce="{{ csp_nonce }}">
      document.addEventListener('htmx:before:request', (evt) => {
        evt.detail.ctx?.target?.setAttribute('aria-busy', 'true');
      });
      document.addEventListener('htmx:finally:request', (evt) => {
        evt.detail.ctx?.target?.removeAttribute('aria-busy');
      });
      {% if debug %}
        // htmx moves hx-preserve elements (the debug toolbar) with moveBefore(),
        // and Chromium drops the stylesheets of a moved <link>: re-add them.
        document.addEventListener('htmx:after:swap', () => {
          for (const el of document.querySelectorAll('[hx-preserve]')) {
            for (const root of [el, el.shadowRoot]) {
              root?.querySelectorAll('link[rel="stylesheet"]').forEach((link) => {
                link.replaceWith(link.cloneNode());
              });
            }
          }
        });
      {% endif %}
      if (typeof navigator.serviceWorker !== 'undefined') {
        navigator.serviceWorker.register('{% static "service-worker.js" %}')
      }
    </script>
  </head>
  <body class="min-h-screen bg-base-100 text-base-content">
    <div id="hx-indicator" x-data="hxIndicator"></div>
    {% include "messages.html" %}
    {% include "navbar.html" %}
    <main class="py-8 px-4 mx-auto max-w-7xl sm:px-6 lg:px-8">
      {% block content %}
      {% endblock content %}
    </main>
    {% cookie_banner %}
    {% block scripts %}
    {% endblock scripts %}
  </body>
</html>

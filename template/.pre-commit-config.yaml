repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^tailwind/daisyui.*\.mjs$'
      - id: end-of-file-fixer
      - id: check-builtin-literals
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-yaml
        exclude: '^helm/.*/templates/.*\.yaml'
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
        exclude: '\.example'
  - repo: local
    hooks:
      - id: helm-lint
        name: Helm lint site chart
        language: system
        entry: helm lint
        args: [helm/site/]
        files: ^helm/site/
        pass_filenames: false
      - id: rustywind
        name: rustywind Tailwind CSS class linter
        language: node
        additional_dependencies:
          - rustywind@0.21.0
        entry: rustywind
        args: [--write]
        files: ^templates
        types_or: [html]
  - repo: https://github.com/gitleaks/gitleaks
    rev: 6eaad039603a4de39fddd1cf5f727391efe9974e  # v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # v0.11.0.1-1
    hooks:
      - id: shellcheck
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: e8f7d69b957a30acb2c875078d5fd012de24b64c  # v0.16.7
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
        # ruff 0.16+ also formats Python blocks in Markdown, which rewrites
        # the partial snippets in docs/ and skills; keep it to Python files
        types_or: [python, pyi, jupyter]
  - repo: https://github.com/rtts/djhtml
    rev: 8577ec017145d76a0b954ebb7cb3169d4303014c  # 3.0.11
    hooks:
      - id: djhtml
        exclude: (^static/vendor|^helm/|(^|.*/)mocks/.*)
      - id: djcss
        exclude: (^static/vendor|^helm/|(^|.*/)mocks/.*)
      - id: djjs
        exclude: (^static/vendor|^helm/|(^|.*/)mocks/.*|^tailwind/daisyui.*\.mjs$)
  - repo: https://github.com/adamchainz/djade-pre-commit
    rev: b8bfd27da9514450edbc0fe5254bc3ba3d3032c6  # 1.9.0
    hooks:
      - id: djade
        args: [--target-version, "6.0"]
        exclude: ^helm/
  - repo: https://github.com/Riverside-Healthcare/djLint
    rev: 152599a9c13abe14c25b8bdf023c8306975ddc3f  # v1.46.1
    hooks:
      - id: djlint-django
        args: ["--lint"]
        exclude: (^static/vendor|^helm/|(^|.*/)mocks/.*)
  - repo: https://github.com/hadolint/hadolint
    rev: 2eece55955ced00200be9729e9728cb7dacca505  # v2.15.1
    hooks:
      - id: hadolint-docker
        # the upstream hook entry is untagged (:latest), so pin the image
        # to match rev — otherwise new hadolint rules break CI unannounced
        entry: ghcr.io/hadolint/hadolint:v2.15.1 hadolint
  - repo: https://github.com/asottile/pyupgrade
    rev: 75992aaa40730136014f34227e0135f63fc951b4  # v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py314]
  - repo: https://github.com/adamchainz/django-upgrade
    rev: 423ab5081e037d3c692113d654d49ea9e3ee0066  # 1.32.0
    hooks:
      - id: django-upgrade
        args: [--target-version, "6.1"]
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 17e12779811926f000bdfa1795f9e3735dd71ac3  # v0.26
    hooks:
      - id: validate-pyproject
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # v1.30.1
    hooks:
      - id: zizmor
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: 253d99053f80e4a368175e93b36edb662e7e5135  # v1.109.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: 25d0a52aa8bc0fc242613346792dc8d726c13347  # v9.26.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']

<ul {% render_attrs attrs id=target|default:None class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3" %}>
  {{ content }}
</ul>

{% partialdef item %}
  <li {% render_attrs attrs %}>
    {{ content }}
  </li>
{% endpartialdef item %}

{% partialdef empty %}
  <li {% render_attrs attrs class="col-span-full py-8 text-center text-(--color-text-muted)" %}>
    {{ content }}
  </li>
{% endpartialdef empty %}
